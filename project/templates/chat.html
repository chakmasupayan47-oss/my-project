<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Chatbot</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .chat-header {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }

        .bot-msg, .user-msg {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 18px;
            margin: 10px 0;
            font-size: 16px;
            line-height: 22px;
        }

        .bot-msg {
            background: #4f7cff;
            color: white;
            border-bottom-left-radius: 5px;
        }

        .user-msg {
            background: #f1f1f1;
            color: #333;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .input-box {
            display: flex;
            margin-top: 20px;
            gap: 10px;
        }

        .input-box input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #bbb;
            font-size: 15px;
        }

        .input-box button {
            background: #4f7cff;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .input-box button:hover {
            background: #3c68e0;
        }

    </style>
</head>
<body>

<div class="chat-container">

    <div class="chat-header">
        🩺 Health Chat Assistant
    </div>

    <!-- Starting bot message -->
    <div class="bot-msg">
        👋 Hello! Welcome to the Health Information Chatbot.<br>
        How can I assist you today?
    </div>

    <!-- Sample user message -->
    <div class="user-msg">
        Hi! I want to check my health risk.
    </div>

    <!-- Sample bot reply -->
    <div class="bot-msg">
        Sure! Please tell me what type of health check you want.
    </div>

    <div class="input-box">
        <input type="text" placeholder="Type your message...">
        <button>Send</button>
    </div>

</div>

</body>
</html>
