<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #4e54c8, #8f94fb);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .box {
            background: white;
            width: 420px;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.25);
            animation: slideUp 0.9s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        h2 {
            color: #4e54c8;
            font-size: 28px;
            margin-bottom: 10px;
        }

        p.result-text {
            font-size: 20px;
            margin-top: 10px;
            color: #333;
            font-weight: 500;
        }

        .btn {
            margin-top: 25px;
            display: inline-block;
            background: #4e54c8;
            color: white;
            font-size: 18px;
            padding: 12px 22px;
            border-radius: 12px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #373cb1;
            transform: translateY(-3px);
        }
    </style>

</head>
<body>

    <div class="box">
        <h2>Your Prediction Result</h2>
                <p style="font-size: 18px;">
            <b>Prediction:</b>
            {% if result == 2 %}
                <span style="color:red;">High Risk</span>
            {% elif result == 1 %}
            <span style="color:red;">Medium Risk</span>
            {% else %}
                <span style="color:green;">Low Risk</span>
            {% endif %}
        </p>
        <p class="result-text">{{ result_text }}</p>

        <a class="btn" href="{{ url_for('index_page') }}">Go Back</a>
    </div>

</body>
</html>
